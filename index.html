<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>A9 App</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root{--bg:#0f0f1a;--card:#1a1a2e;--card-hover:#22223a;--accent:#4cc9f0;--text:#e8e8f0;--muted:#a0a0b8;--success:#4ade80;--warning:#fbbf24;--danger:#f87171;--radius:14px}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC","PingFang TC",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.45}
    header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid #2a2a3a;position:sticky;top:0;z-index:100}
    header h1{font-size:1.2rem;font-weight:700}
    .settings-btn{background:var(--card-hover);border:1px solid #333;color:var(--text);padding:6px 14px;border-radius:18px;font-size:.85rem;cursor:pointer}
    .settings-btn.hidden{display:none}
    .tabs{display:flex;background:var(--card);border-bottom:1px solid #2a2a3a;padding:6px 10px;gap:6px;position:sticky;top:53px;z-index:90}
    .tab{flex:1;text-align:center;padding:10px 6px;border-radius:10px;font-weight:600;font-size:.9rem;cursor:pointer;border:none;background:transparent;color:var(--muted)}
    .tab.active{background:linear-gradient(135deg,#4cc9f0,#4895ef);color:#0f0f1a}
    .panel{display:none;padding:14px 16px 90px;max-width:720px;margin:0 auto}
    .panel.active{display:block}
    .card{background:var(--card);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;border:1px solid rgba(255,255,255,.04)}
    .panel-title{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
    .general{font-size:.88rem;color:var(--muted);line-height:1.5}
    .day-row{display:grid;grid-template-columns:56px 36px 1fr auto;align-items:center;gap:10px;padding:10px 12px;background:var(--card-hover);border-radius:12px;margin-bottom:8px}
    .day-row.today{border:1px solid var(--accent);background:linear-gradient(90deg,#1a2a3a,#1a1a2e)}
    .day-name{font-weight:700;font-size:.9rem}.day-date{font-size:.72rem;color:var(--muted)}
    .weather-icon{font-size:1.5rem;text-align:center}
    .temps{font-weight:600;font-size:.95rem}.temps span{color:var(--muted);font-weight:400}
    .psr-badge{font-size:.68rem;padding:2px 7px;border-radius:8px;background:rgba(76,201,240,.15);color:var(--accent);white-space:nowrap}
    .weather-desc{grid-column:1/-1;font-size:.78rem;color:var(--muted);margin-top:2px}
    .preset-card{background:var(--card);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;border:1px solid rgba(255,255,255,.05)}
    .preset-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
    .preset-route{font-size:1.3rem;font-weight:800;color:var(--accent)}
    .preset-dest{font-size:.85rem;color:var(--muted);margin-top:3px;line-height:1.35}
    .preset-stop{font-size:.9rem;font-weight:600;margin-top:4px}
    .icon-btn{background:none;border:1px solid #333;color:var(--muted);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:.9rem;display:inline-flex;align-items:center;justify-content:center}
    .icon-btn:hover{border-color:var(--accent);color:var(--accent)}
    .icon-btn.danger:hover{border-color:var(--danger);color:var(--danger)}
    .eta-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid #2a2a3a}
    .eta-row:first-of-type{border-top:none;padding-top:0}
    .eta-time{font-weight:800;font-size:1.15rem;min-width:64px;text-align:right}
    .eta-time.soon{color:var(--success)}.eta-time.mid{color:var(--warning)}.eta-time.late{color:var(--muted)}
    .eta-meta{font-size:.8rem;color:var(--muted)}
    .empty-state{text-align:center;padding:40px 20px;color:var(--muted)}
    .empty-state p{margin:8px 0 16px;font-size:.9rem}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
    .modal{background:var(--card);border-radius:18px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:20px;border:1px solid #333}
    .modal h2{font-size:1.1rem;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
    .modal label{display:block;font-size:.8rem;color:var(--muted);margin:12px 0 4px}
    .modal input,.modal select{width:100%;background:var(--card-hover);border:1px solid #333;color:var(--text);padding:10px 12px;border-radius:10px;font-size:.95rem;outline:none}
    .modal input:focus,.modal select:focus{border-color:var(--accent)}
    .modal-actions{display:flex;gap:10px;margin-top:18px}
    .btn{flex:1;padding:12px;border-radius:12px;font-weight:700;font-size:.95rem;cursor:pointer;border:none}
    .btn-primary{background:linear-gradient(135deg,#4cc9f0,#4895ef);color:#0f0f1a}
    .btn-secondary{background:transparent;border:1px solid #444;color:var(--text)}
    .btn:disabled{opacity:.45;cursor:not-allowed}
    .search-hint{font-size:.8rem;color:var(--muted);margin-top:6px}
    .status{text-align:center;padding:16px;color:var(--muted);font-size:.9rem}
    .spinner{display:inline-block;width:18px;height:18px;border:2.5px solid #333;border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin-right:8px;vertical-align:middle}
    @keyframes spin{to{transform:rotate(360deg)}}
    .hidden{display:none!important}
    .update-time{font-size:.72rem;color:var(--muted)}
  </style>
</head>
<body>
  <header>
    <h1>🚌 A9 App</h1>
    <button class="settings-btn" id="settingsBtn" onclick="openSettings()">⚙️ 設定路線</button>
  </header>
  <div class="tabs">
    <button class="tab active" data-tab="kmb" onclick="switchTab('kmb')">🚌 九巴</button>
    <button class="tab" data-tab="gmb" onclick="switchTab('gmb')">🚐 小巴</button>
    <button class="tab" data-tab="weather" onclick="switchTab('weather')">🌤 天氣</button>
  </div>

  <div class="panel active" id="panel-kmb">
    <div class="panel-title"><span>我的九巴</span><button class="icon-btn" onclick="refreshKmb()">↻</button></div>
    <div id="kmbPresets"></div>
  </div>
  <div class="panel" id="panel-gmb">
    <div class="panel-title"><span>我的小巴</span><button class="icon-btn" onclick="refreshGmb()">↻</button></div>
    <div id="gmbPresets"></div>
  </div>
  <div class="panel" id="panel-weather">
    <div class="panel-title"><span>天文台九天預報</span><span class="update-time" id="weatherUpdate"></span></div>
    <div class="card"><div class="general" id="generalSituation">載入中…</div></div>
    <div id="forecastList"><div class="status"><span class="spinner"></span> 載入中…</div></div>
  </div>

  <div class="modal-overlay hidden" id="settingsModal">
    <div class="modal">
      <h2><span id="modalTitle">設定路線</span><button class="icon-btn" onclick="closeSettings()">✕</button></h2>
      <div id="modalBody"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeSettings()">取消</button>
        <button class="btn btn-primary" id="saveBtn" onclick="saveCurrentPreset()" disabled>儲存</button>
      </div>
      <hr style="border:none;border-top:1px solid #333;margin:18px 0 10px">
      <div style="font-size:.85rem;color:var(--muted)">目前已儲存：</div>
      <div id="cfgList" style="margin-top:8px"></div>
    </div>
  </div>

  <script>
    let currentTab='kmb';
    let kmbPresets=JSON.parse(localStorage.getItem('a9_kmb')||'[]');
    let gmbPresets=JSON.parse(localStorage.getItem('a9_gmb')||'[]');
    let stopMap=null, weatherData=null, _cfg={};

    function switchTab(tab){
      currentTab=tab;
      document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
      document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
      document.getElementById('panel-'+tab).classList.add('active');
      document.getElementById('settingsBtn').classList.toggle('hidden',tab==='weather');
    }

    const iconMap={50:'☀️',51:'🌤',52:'⛅',53:'☁️',54:'🌫',60:'🌧',61:'🌦',62:'🌧',63:'⛈',64:'⛈',65:'🌧',70:'❄️',71:'❄️',72:'❄️',73:'❄️',80:'⛈',81:'⛈',82:'⛈',90:'🌡',91:'🌡',92:'💨',93:'💨'};

    async function loadWeather(){
      try{
        const res=await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
        weatherData=await res.json();
        renderWeather(weatherData);
      }catch(e){document.getElementById('forecastList').innerHTML='<div class="status">載入失敗</div>';}
    }

    function renderWeather(data){
      document.getElementById('generalSituation').textContent=data.generalSituation||'';
      const nowHK=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Hong_Kong'}));
      const todayStr=nowHK.getFullYear()+String(nowHK.getMonth()+1).padStart(2,'0')+String(nowHK.getDate()).padStart(2,'0');
      document.getElementById('forecastList').innerHTML=data.weatherForecast.map(day=>{
        const isToday=day.forecastDate===todayStr;
        const icon=iconMap[day.ForecastIcon]||'🌤';
        const dateStr=day.forecastDate.slice(4,6)+'/'+day.forecastDate.slice(6);
        return `<div class="day-row ${isToday?'today':''}"><div><div class="day-name">${isToday?'今日':day.week}</div><div class="day-date">${dateStr}</div></div><div class="weather-icon">${icon}</div><div><div class="temps">${day.forecastMaxtemp.value}° <span>/ ${day.forecastMintemp.value}°</span></div><div class="weather-desc">${day.forecastWeather}</div></div><div class="psr-badge">PSR ${day.PSR}</div></div>`;
      }).join('');
      try{
        const ut=new Date(data.updateTime);
        window._hkoUpdateStr=ut.toLocaleString('zh-HK',{timeZone:'Asia/Hong_Kong',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
      }catch(e){window._hkoUpdateStr='';}
      updateWeatherClock();
    }

    function updateWeatherClock(){
      const el=document.getElementById('weatherUpdate');
      if(!el)return;
      const nowStr=new Date().toLocaleString('zh-HK',{timeZone:'Asia/Hong_Kong',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
      el.textContent=window._hkoUpdateStr?`天文台更新於 ${window._hkoUpdateStr} · 現在 ${nowStr}`:`現在 ${nowStr}`;
    }

    function saveKmb(){localStorage.setItem('a9_kmb',JSON.stringify(kmbPresets));}
    function saveGmb(){localStorage.setItem('a9_gmb',JSON.stringify(gmbPresets));}

    function renderKmb(){
      const box=document.getElementById('kmbPresets');
      if(kmbPresets.length===0){
        box.innerHTML=`<div class="empty-state"><div style="font-size:2.2rem">🚏</div><p>尚未設定九巴路線</p><button class="btn btn-primary" style="max-width:180px;margin:0 auto" onclick="openSettings()">+ 新增路線</button></div>`;
        return;
      }
      box.innerHTML=kmbPresets.map((p,i)=>{
        const dir=(p.orig_tc&&p.dest_tc)?`${p.orig_tc} → ${p.dest_tc}`:(p.dest_tc||'');
        const bound=p.bound==='O'?'去程':'回程';
        return `<div class="preset-card"><div class="preset-header"><div style="flex:1;min-width:0"><div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap"><span class="preset-route">${p.route}</span><span style="font-size:.72rem;background:#2a2a3a;padding:2px 7px;border-radius:8px;color:var(--muted)">${bound}</span></div><div class="preset-dest">${dir}</div><div class="preset-stop">📍 ${p.stopName}</div></div><div style="display:flex;gap:6px"><button class="icon-btn" onclick="loadKmbEta(${i})">↻</button><button class="icon-btn danger" onclick="removeKmb(${i})">✕</button></div></div><div id="kmb-eta-${i}"><div class="status"><span class="spinner"></span> 載入中…</div></div></div>`;
      }).join('');
      kmbPresets.forEach((_,i)=>loadKmbEta(i));
    }

    async function loadKmbEta(i){
      const p=kmbPresets[i],el=document.getElementById('kmb-eta-'+i);
      if(!p||!el)return;
      try{
        let res=await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/eta/${p.stopId}/${p.route}/${p.service_type||'1'}`);
        let json=await res.json();
        let etas=(json.data||[]).filter(e=>e.eta);
        if(etas.length===0){
          res=await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${p.stopId}`);
          json=await res.json();
          etas=(json.data||[]).filter(e=>e.route===p.route&&e.eta);
        }
        renderEtas(el,etas);
      }catch(e){el.innerHTML='<div class="status">錯誤</div>';}
    }

    function removeKmb(i){if(!confirm('刪除此九巴路線？'))return;kmbPresets.splice(i,1);saveKmb();renderKmb();}
    function refreshKmb(){kmbPresets.forEach((_,i)=>loadKmbEta(i));}

    function renderGmb(){
      const box=document.getElementById('gmbPresets');
      if(gmbPresets.length===0){
        box.innerHTML=`<div class="empty-state"><div style="font-size:2.2rem">🚐</div><p>尚未設定小巴路線</p><button class="btn btn-primary" style="max-width:180px;margin:0 auto" onclick="openSettings()">+ 新增路線</button></div>`;
        return;
      }
      box.innerHTML=gmbPresets.map((p,i)=>{
        const dir=(p.orig&&p.dest)?`${p.orig} → ${p.dest}`:(p.dest||'');
        return `<div class="preset-card"><div class="preset-header"><div style="flex:1;min-width:0"><div class="preset-route">${p.route_code}</div><div class="preset-dest">${dir}</div><div class="preset-stop">📍 ${p.stopName}</div></div><div style="display:flex;gap:6px"><button class="icon-btn" onclick="loadGmbEta(${i})">↻</button><button class="icon-btn danger" onclick="removeGmb(${i})">✕</button></div></div><div id="gmb-eta-${i}"><div class="status"><span class="spinner"></span> 載入中…</div></div></div>`;
      }).join('');
      gmbPresets.forEach((_,i)=>loadGmbEta(i));
    }

    async function loadGmbEta(i){
      const p=gmbPresets[i],el=document.getElementById('gmb-eta-'+i);
      if(!p||!el)return;
      try{
        const res=await fetch(`https://data.etagmb.gov.hk/eta/route-stop/${p.route_id}/${p.route_seq}/${p.stop_seq}`);
        const json=await res.json();
        const etas=(json.data&&json.data.eta)||json.data||[];
        renderGmbEtas(el,Array.isArray(etas)?etas:[]);
      }catch(e){
        try{
          const res2=await fetch(`https://data.etagmb.gov.hk/eta/stop/${p.stop_id}`);
          const json2=await res2.json();
          const all=json2.data||[];
          renderGmbEtas(el,all.filter(e=>String(e.route_id)===String(p.route_id)));
        }catch(e2){el.innerHTML='<div class="status">錯誤 / 暫無資料</div>';}
      }
    }

    function renderGmbEtas(el,etas){
      if(!etas||etas.length===0){el.innerHTML='<div class="status">暫無到站資料</div>';return;}
      const now=Date.now();
      el.innerHTML=etas.slice(0,4).map(e=>{
        let mins=null;
        if(e.diff!==undefined)mins=Math.round(e.diff);
        else if(e.timestamp)mins=Math.round((new Date(e.timestamp)-now)/60000);
        else if(e.eta)mins=Math.round((new Date(e.eta)-now)/60000);
        let timeStr='—',cls='late';
        if(mins!==null&&!isNaN(mins)){
          if(mins<=1){timeStr='即將到達';cls='soon';}
          else if(mins<=5){timeStr=mins+' 分鐘';cls='soon';}
          else if(mins<=15){timeStr=mins+' 分鐘';cls='mid';}
          else{timeStr=mins+' 分鐘';cls='late';}
        }
        const remark=e.remarks_tc||e.remark_tc||e.remarks||'';
        return `<div class="eta-row"><div class="eta-meta">${remark||'預計到站'}</div><div class="eta-time ${cls}">${timeStr}</div></div>`;
      }).join('');
    }

    function removeGmb(i){if(!confirm('刪除此小巴路線？'))return;gmbPresets.splice(i,1);saveGmb();renderGmb();}
    function refreshGmb(){gmbPresets.forEach((_,i)=>loadGmbEta(i));}

    function renderEtas(el,etas){
      if(!etas||etas.length===0){el.innerHTML='<div class="status">暫無到站資料</div>';return;}
      const now=Date.now();
      el.innerHTML=etas.slice(0,4).map(e=>{
        const mins=Math.round((new Date(e.eta)-now)/60000);
        let timeStr,cls;
        if(mins<=1){timeStr='即將到達';cls='soon';}
        else if(mins<=5){timeStr=mins+' 分鐘';cls='soon';}
        else if(mins<=15){timeStr=mins+' 分鐘';cls='mid';}
        else{timeStr=mins+' 分鐘';cls='late';}
        const dest=e.dest_tc||e.dest_en||'';
        const rmk=e.rmk_tc||'';
        return `<div class="eta-row"><div class="eta-meta">${dest}${rmk?' · '+rmk:''}</div><div class="eta-time ${cls}">${timeStr}</div></div>`;
      }).join('');
    }

    function openSettings(){
      document.getElementById('settingsModal').classList.remove('hidden');
      document.getElementById('saveBtn').disabled=true;
      _cfg={};
      if(currentTab==='kmb'){
        document.getElementById('modalTitle').textContent='新增九巴路線';
        renderKmbConfigForm();
        renderCfgList(kmbPresets,'kmb');
      }else{
        document.getElementById('modalTitle').textContent='新增小巴路線';
        renderGmbConfigForm();
        renderCfgList(gmbPresets,'gmb');
      }
    }
    function closeSettings(){document.getElementById('settingsModal').classList.add('hidden');}

    function renderCfgList(list,type){
      const el=document.getElementById('cfgList');
      if(list.length===0){el.innerHTML='<div style="color:var(--muted);font-size:.85rem">（無）</div>';return;}
      el.innerHTML=list.map((p,i)=>{
        const name=type==='kmb'?p.route:p.route_code;
        return `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #2a2a3a;font-size:.9rem"><span><strong style="color:var(--accent)">${name}</strong> · ${p.stopName}</span><button class="icon-btn danger" style="width:28px;height:28px" onclick="${type==='kmb'?`removeKmb(${i})`:`removeGmb(${i})`};openSettings()">✕</button></div>`;
      }).join('');
    }

    function renderKmbConfigForm(){
      document.getElementById('modalBody').innerHTML=`<label>1. 輸入路線號碼</label><div style="display:flex;gap:8px"><input type="text" id="cfgRoute" placeholder="例如 49X, 74D, 288C" style="flex:1"/><button class="btn btn-primary" style="flex:0 0 auto;padding:10px 14px" onclick="fetchKmbDirections()">Fetch</button></div><div class="search-hint" id="cfgHint"></div><div id="cfgDirSection" class="hidden" style="margin-top:14px"><label>2. 選擇方向</label><div id="cfgDirList" style="display:flex;flex-direction:column;gap:8px;margin-top:6px"></div></div><div id="cfgStopSection" class="hidden" style="margin-top:14px"><label>3. 選擇車站</label><select id="cfgStop" style="margin-top:6px"></select></div>`;
      document.getElementById('cfgRoute').addEventListener('keydown',e=>{if(e.key==='Enter')fetchKmbDirections();});
      setTimeout(()=>document.getElementById('cfgRoute')?.focus(),80);
    }

    async function fetchKmbDirections(){
      const route=document.getElementById('cfgRoute').value.trim().toUpperCase();
      const hint=document.getElementById('cfgHint');
      document.getElementById('cfgDirSection').classList.add('hidden');
      document.getElementById('cfgStopSection').classList.add('hidden');
      document.getElementById('saveBtn').disabled=true;
      if(!route){hint.textContent='請輸入路線號碼';return;}
      hint.innerHTML='<span class="spinner"></span> 搜尋中…';
      try{
        const res=await fetch('https://data.etabus.gov.hk/v1/transport/kmb/route/');
        const json=await res.json();
        const matches=json.data.filter(r=>r.route===route);
        if(matches.length===0){hint.textContent='找不到此路線';return;}
        hint.textContent=`找到 ${matches.length} 個方向`;
        document.getElementById('cfgDirList').innerHTML=matches.map(m=>{
          const o=m.orig_tc||m.orig_en,d=m.dest_tc||m.dest_en;
          const bound=m.bound==='O'?'去程':'回程';
          const svc=(m.service_type!=1)?` <span style="color:var(--warning)">(type ${m.service_type})</span>`:'';
          return `<button class="btn btn-secondary" style="text-align:left;padding:12px 14px;font-weight:500" onclick='selectKmbDir(${JSON.stringify(m).replace(/'/g,"&#39;")})'><div style="font-weight:700">${bound}${svc}</div><div style="font-size:.9rem">${o} → ${d}</div></button>`;
        }).join('');
        document.getElementById('cfgDirSection').classList.remove('hidden');
      }catch(e){hint.textContent='Error: '+e.message;}
    }

    async function selectKmbDir(meta){
      _cfg={type:'kmb',meta};
      const hint=document.getElementById('cfgHint');
      hint.innerHTML='<span class="spinner"></span> 載入車站…';
      document.getElementById('cfgStopSection').classList.add('hidden');
      document.getElementById('saveBtn').disabled=true;
      try{
        if(!stopMap){
          const sRes=await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop');
          const sJson=await sRes.json();
          stopMap={};sJson.data.forEach(s=>{stopMap[s.stop]=s;});
        }
        const dir=meta.bound==='O'?'outbound':'inbound';
        const res=await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${meta.route}/${dir}/${meta.service_type}`);
        const json=await res.json();
        const stops=json.data||[];
        if(stops.length===0){hint.textContent='此方向沒有車站';return;}
        document.getElementById('cfgStop').innerHTML=stops.map((s,i)=>{
          const info=stopMap[s.stop]||{};
          const name=info.name_tc||info.name_en||s.stop;
          return `<option value="${s.stop}" data-name="${name.replace(/"/g,'&quot;')}">${i+1}. ${name}</option>`;
        }).join('');
        document.getElementById('cfgStopSection').classList.remove('hidden');
        document.getElementById('saveBtn').disabled=false;
        hint.textContent=`${stops.length} 個車站 — 請選擇上車站`;
      }catch(e){hint.textContent='Error: '+e.message;}
    }

    function renderGmbConfigForm(){
      document.getElementById('modalBody').innerHTML=`<label>1. 選擇地區 + 輸入路線號碼</label><div style="display:flex;gap:8px"><select id="cfgRegion" style="flex:0 0 90px"><option value="NT">新界 NT</option><option value="KLN">九龍 KLN</option><option value="HKI">港島 HKI</option></select><input type="text" id="cfgRoute" placeholder="例如 65K, 403X" style="flex:1"/><button class="btn btn-primary" style="flex:0 0 auto;padding:10px 14px" onclick="fetchGmbDirections()">Fetch</button></div><div class="search-hint" id="cfgHint"></div><div id="cfgDirSection" class="hidden" style="margin-top:14px"><label>2. 選擇方向</label><div id="cfgDirList" style="display:flex;flex-direction:column;gap:8px;margin-top:6px"></div></div><div id="cfgStopSection" class="hidden" style="margin-top:14px"><label>3. 選擇車站</label><select id="cfgStop" style="margin-top:6px"></select></div>`;
      document.getElementById('cfgRoute').addEventListener('keydown',e=>{if(e.key==='Enter')fetchGmbDirections();});
      setTimeout(()=>document.getElementById('cfgRoute')?.focus(),80);
    }

    async function fetchGmbDirections(){
      const region=document.getElementById('cfgRegion').value;
      const code=document.getElementById('cfgRoute').value.trim().toUpperCase();
      const hint=document.getElementById('cfgHint');
      document.getElementById('cfgDirSection').classList.add('hidden');
      document.getElementById('cfgStopSection').classList.add('hidden');
      document.getElementById('saveBtn').disabled=true;
      if(!code){hint.textContent='請輸入路線號碼';return;}
      hint.innerHTML='<span class="spinner"></span> 搜尋中…';
      try{
        const res=await fetch(`https://data.etagmb.gov.hk/route/${region}/${code}`);
        const json=await res.json();
        const data=json.data;
        if(!data||!data.directions||data.directions.length===0){hint.textContent='找不到此小巴路線';return;}
        const directions=data.directions;
        const routeId=data.route_id;
        hint.textContent=`找到 ${directions.length} 個方向`;
        document.getElementById('cfgDirList').innerHTML=directions.map((d,idx)=>{
          const o=d.orig_tc||d.orig_en||d.origin_tc||'';
          const dest=d.dest_tc||d.dest_en||d.destination_tc||'';
          const seq=d.route_seq||(idx+1);
          return `<button class="btn btn-secondary" style="text-align:left;padding:12px 14px;font-weight:500" onclick='selectGmbDir(${routeId},${seq},${JSON.stringify({orig:o,dest:dest,route_code:code}).replace(/'/g,"&#39;")})'><div style="font-weight:700">方向 ${seq}</div><div style="font-size:.9rem">${o} → ${dest}</div></button>`;
        }).join('');
        document.getElementById('cfgDirSection').classList.remove('hidden');
      }catch(e){hint.textContent='Error: '+e.message;}
    }

    async function selectGmbDir(routeId,routeSeq,info){
      _cfg={type:'gmb',route_id:routeId,route_seq:routeSeq,route_code:info.route_code,orig:info.orig,dest:info.dest};
      const hint=document.getElementById('cfgHint');
      hint.innerHTML='<span class="spinner"></span> 載入車站…';
      document.getElementById('cfgStopSection').classList.add('hidden');
      document.getElementById('saveBtn').disabled=true;
      try{
        const res=await fetch(`https://data.etagmb.gov.hk/route-stop/${routeId}/${routeSeq}`);
        const json=await res.json();
        const stops=(json.data&&json.data.route_stops)||json.data||[];
        if(!stops.length){hint.textContent='此方向沒有車站';return;}
        document.getElementById('cfgStop').innerHTML=stops.map((s,i)=>{
          const name=s.name_tc||s.name_en||s.stop_name||('Stop '+(s.stop_seq||i+1));
          return `<option value="${s.stop_id||s.stopId}" data-seq="${s.stop_seq||i+1}" data-name="${name.replace(/"/g,'&quot;')}">${s.stop_seq||i+1}. ${name}</option>`;
        }).join('');
        document.getElementById('cfgStopSection').classList.remove('hidden');
        document.getElementById('saveBtn').disabled=false;
        hint.textContent=`${stops.length} 個車站 — 請選擇上車站`;
      }catch(e){hint.textContent='Error: '+e.message;}
    }

    function saveCurrentPreset(){
      if(_cfg.type==='kmb'){
        const meta=_cfg.meta;
        const stopId=document.getElementById('cfgStop').value;
        const opt=document.getElementById('cfgStop').selectedOptions[0];
        const stopName=opt?.dataset.name||stopId;
        const preset={route:meta.route,bound:meta.bound,service_type:String(meta.service_type),stopId,stopName,dest_tc:meta.dest_tc||'',dest_en:meta.dest_en||'',orig_tc:meta.orig_tc||'',orig_en:meta.orig_en||''};
        if(kmbPresets.some(p=>p.route===preset.route&&p.stopId===preset.stopId&&p.bound===preset.bound)){alert('此組合已存在');return;}
        kmbPresets.push(preset);saveKmb();closeSettings();renderKmb();
      }else if(_cfg.type==='gmb'){
        const opt=document.getElementById('cfgStop').selectedOptions[0];
        const stopId=document.getElementById('cfgStop').value;
        const stopSeq=opt?.dataset.seq||'1';
        const stopName=opt?.dataset.name||stopId;
        const preset={route_id:_cfg.route_id,route_seq:_cfg.route_seq,route_code:_cfg.route_code,stop_id:stopId,stop_seq:stopSeq,stopName,orig:_cfg.orig,dest:_cfg.dest};
        if(gmbPresets.some(p=>p.route_id==preset.route_id&&p.stop_id==preset.stop_id&&p.route_seq==preset.route_seq)){alert('此組合已存在');return;}
        gmbPresets.push(preset);saveGmb();closeSettings();renderGmb();
      }
    }

    switchTab('kmb');
    renderKmb();
    renderGmb();
    loadWeather();
    setInterval(refreshKmb,30000);
    setInterval(refreshGmb,30000);
    setInterval(loadWeather,30*60*1000);
    setInterval(updateWeatherClock,1000);
    document.getElementById('settingsModal').addEventListener('click',e=>{if(e.target.id==='settingsModal')closeSettings();});
  </script>
</body>
</html>
