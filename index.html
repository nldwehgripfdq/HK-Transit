<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>A9 App</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root{--bg:#0f0f1a;--card:#1a1a2e;--card-hover:#22223a;--accent:#4cc9f0;--text:#e8e8f0;--muted:#a0a0b8;--success:#4ade80;--warning:#fbbf24;--danger:#f87171;--radius:14px}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC","PingFang TC",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.45}
    header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid #2a2a3a;position:sticky;top:0;z-index:100}
    header h1{font-size:1.2rem;font-weight:700}
    .header-actions{display:flex;gap:8px;align-items:center}
    .header-btn{background:var(--card-hover);border:1px solid #333;color:var(--text);padding:6px 12px;border-radius:18px;font-size:.85rem;cursor:pointer}
    .header-btn.hidden{display:none}
    .tabs{display:flex;background:var(--card);border-bottom:1px solid #2a2a3a;padding:6px 8px;gap:5px;position:sticky;top:53px;z-index:90}
    .tab{flex:1;text-align:center;padding:10px 4px;border-radius:10px;font-weight:600;font-size:.85rem;cursor:pointer;border:none;background:transparent;color:var(--muted)}
    .tab.active{background:linear-gradient(135deg,#4cc9f0,#4895ef);color:#0f0f1a}
    .panel{display:none;padding:14px 16px 90px;max-width:720px;margin:0 auto}
    .panel.active{display:block}
    .card{background:var(--card);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;border:1px solid rgba(255,255,255,.04)}
    .panel-title{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
    .general{font-size:.88rem;color:var(--muted);line-height:1.5}
    .day-row{display:grid;grid-template-columns:56px 36px 1fr auto;align-items:center;gap:10px;padding:10px 12px;background:var(--card-hover);border-radius:12px;margin-bottom:8px}
    .day-row.today{border:1px solid var(--accent)}
    .day-name{font-weight:700;font-size:.9rem}.day-date{font-size:.72rem;color:var(--muted)}
    .weather-icon{font-size:1.5rem;text-align:center}
    .temps{font-weight:600;font-size:.95rem}.temps span{color:var(--muted);font-weight:400}
    .psr-badge{font-size:.68rem;padding:2px 7px;border-radius:8px;background:rgba(76,201,240,.15);color:var(--accent)}
    .weather-desc{grid-column:1/-1;font-size:.78rem;color:var(--muted);margin-top:2px}
    .preset-card{background:var(--card);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;border:1px solid rgba(255,255,255,.05)}
    .preset-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
    .preset-route{font-size:1.15rem;font-weight:800;color:var(--accent)}
    .preset-dest{font-size:.85rem;color:var(--muted);margin-top:3px;line-height:1.35}
    .preset-stop{font-size:.9rem;font-weight:600;margin-top:4px}
    .icon-btn{background:none;border:1px solid #333;color:var(--muted);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:.9rem;display:inline-flex;align-items:center;justify-content:center}
    .icon-btn:hover{border-color:var(--accent);color:var(--accent)}
    .icon-btn.danger:hover{border-color:var(--danger);color:var(--danger)}
    .eta-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid #2a2a3a}
    .eta-row:first-of-type{border-top:none;padding-top:0}
    .eta-time{font-weight:800;font-size:1.1rem;min-width:64px;text-align:right}
    .eta-time.soon{color:var(--success)}.eta-time.mid{color:var(--warning)}.eta-time.late{color:var(--muted)}
    .eta-meta{font-size:.8rem;color:var(--muted)}
    .empty-state{text-align:center;padding:40px 20px;color:var(--muted)}
    .empty-state p{margin:8px 0 16px;font-size:.9rem}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
    .modal{background:var(--card);border-radius:18px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:20px;border:1px solid #333}
    .modal h2{font-size:1.1rem;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
    .modal label,.mtr-form label{display:block;font-size:.8rem;color:var(--muted);margin:12px 0 4px}
    .modal input,.modal select,select{width:100%;background:var(--card-hover);border:1px solid #333;color:var(--text);padding:10px 12px;border-radius:10px;font-size:.95rem;outline:none}
    .modal-actions{display:flex;gap:10px;margin-top:18px}
    .btn{flex:1;padding:12px;border-radius:12px;font-weight:700;font-size:.95rem;cursor:pointer;border:none}
    .btn-primary{background:linear-gradient(135deg,#4cc9f0,#4895ef);color:#0f0f1a}
    .btn-secondary{background:transparent;border:1px solid #444;color:var(--text)}
    .btn:disabled{opacity:.45;cursor:not-allowed}
    .search-hint{font-size:.8rem;color:var(--muted);margin-top:6px}
    .status{text-align:center;padding:16px;color:var(--muted);font-size:.9rem}
    .spinner{display:inline-block;width:18px;height:18px;border:2.5px solid #333;border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin-right:8px;vertical-align:middle}
    @keyframes spin{to{transform:rotate(360deg)}}
    .hidden{display:none!important}
    .update-time{font-size:.72rem;color:var(--muted)}
    .mtr-row{display:flex;gap:8px}
    .mtr-row select{flex:1}
    .path-option{text-align:left;padding:12px 14px;margin-bottom:8px;border:1px solid #333;border-radius:12px;background:transparent;color:var(--text);cursor:pointer;width:100%;font-size:.9rem}
    .path-option:hover,.path-option.selected{border-color:var(--accent);background:rgba(76,201,240,.08)}
    .leg-block{margin-top:10px;padding-top:10px;border-top:1px solid #2a2a3a}
    .leg-title{font-size:.85rem;font-weight:700;margin-bottom:6px}
    .train-hours{display:inline-block;font-size:.74rem;background:rgba(76,201,240,.12);color:var(--accent);padding:2px 8px;border-radius:6px;margin-top:5px}
  </style>
</head>
<body>
  <header>
    <h1>🚌 A9 App</h1>
    <div class="header-actions">
      <button class="header-btn" onclick="forceRefresh()">↻ 重新整理</button>
      <button class="header-btn" id="settingsBtn" onclick="openSettings()">⚙️ 設定路線</button>
    </div>
  </header>
  <div class="tabs">
    <button class="tab active" data-tab="kmb" onclick="switchTab('kmb')">🚌 九巴</button>
    <button class="tab" data-tab="mtr" onclick="switchTab('mtr')">🚇 港鐵</button>
    <button class="tab" data-tab="weather" onclick="switchTab('weather')">🌤 天氣</button>
  </div>

  <div class="panel active" id="panel-kmb">
    <div class="panel-title"><span>我的九巴</span><button class="icon-btn" onclick="refreshKmb()">↻</button></div>
    <div id="kmbPresets"></div>
  </div>

  <div class="panel" id="panel-mtr">
    <div class="panel-title"><span>我的港鐵</span><button class="icon-btn" onclick="refreshMtr()">↻</button></div>
    <div id="mtrPresets"></div>
  </div>

  <div class="panel" id="panel-weather">
    <div class="panel-title"><span>天文台九天預報</span><span class="update-time" id="weatherUpdate"></span></div>
    <div class="card"><div class="general" id="generalSituation">載入中…</div></div>
    <div id="forecastList"><div class="status"><span class="spinner"></span> 載入中…</div></div>
  </div>

  <div class="modal-overlay hidden" id="settingsModal">
    <div class="modal">
      <h2><span id="modalTitle">設定路線</span><button class="icon-btn" onclick="closeSettings()">✕</button></h2>
      <div id="modalBody"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeSettings()">取消</button>
        <button class="btn btn-primary" id="saveBtn" onclick="saveCurrentPreset()" disabled>儲存</button>
      </div>
      <hr style="border:none;border-top:1px solid #333;margin:18px 0 10px">
      <div style="font-size:.85rem;color:var(--muted)">目前已儲存：</div>
      <div id="cfgList" style="margin-top:8px"></div>
    </div>
  </div>

    // ===== OFFICIAL MTR HRROUTES API =====
    function resolveLineCode(lineId, staA, staB){
      if(MTR_LINE_ID_MAP[lineId]){
        const mapped = MTR_LINE_ID_MAP[lineId];
        if(MTR_LINE_POS[mapped]?.[staA] !== undefined && MTR_LINE_POS[mapped]?.[staB] !== undefined){
          return mapped;
        }
      }
      for(const lc of Object.keys(MTR_LINE_POS)){
        const pos = MTR_LINE_POS[lc];
        if(pos[staA] !== undefined && pos[staB] !== undefined && Math.abs(pos[staA] - pos[staB]) === 1){
          return lc;
        }
      }
      return MTR_LINE_ID_MAP[lineId] || 'EAL';
    }

    async function fetchOfficialMtrRoutes(fromCode, toCode){
      const oId = MTR_STATIONS[fromCode]?.id;
      const dId = MTR_STATIONS[toCode]?.id;
      if(!oId || !dId || fromCode === toCode) return [];

      const targetUrl = `https://www.mtr.com.hk/share/customer/jp/api/HRRoutes/?o=${oId}&d=${dId}&lang=C`;
      let data = null;

      const urls = [
        `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,
        targetUrl
      ];
      for(const u of urls){
        try{
          const res = await fetch(u);
          if(res.ok){
            data = await res.json();
            if(data && data.errorCode === "0") break;
          }
        }catch(e){}
      }

      if(!data || data.errorCode !== "0" || !Array.isArray(data.routes)){
        throw new Error('無法連接港鐵路線伺服器');
      }

      const firstTrain = data.firstTrain?.time || '';
      const lastTrain = data.lastTrain?.time || '';

      return data.routes.map(route => {
        const rawPath = route.path || [];
        const stationCodes = [];
        const segmentLines = [];

        for(let i = 0; i < rawPath.length; i++){
          const code = ID_TO_CODE[String(rawPath[i].ID)];
          if(!code) continue;
          if(stationCodes.length && stationCodes[stationCodes.length - 1] === code) continue;
          stationCodes.push(code);
          if(stationCodes.length > 1){
            const prevCode = stationCodes[stationCodes.length - 2];
            const lc = resolveLineCode(rawPath[i - 1].lineID, prevCode, code);
            segmentLines.push(lc);
          }
        }

        const legs = [];
        let i = 0;
        while(i < segmentLines.length){
          let j = i;
          while(j < segmentLines.length && segmentLines[j] === segmentLines[i]) j++;
          const line = segmentLines[i];
          const from = stationCodes[i];
          const to = stationCodes[j];
          const pa = MTR_LINE_POS[line]?.[from] ?? 0;
          const pb = MTR_LINE_POS[line]?.[to] ?? 0;
          legs.push({
            line,
            from,
            to,
            hops: j - i,
            stations: j - i + 1,
            dir: pb > pa ? 'UP' : 'DOWN'
          });
          i = j;
        }

        const stdFare = route.fares?.find(f => f.fareTitle === 'standardClass')?.fareInfo;
        const octopusFare = stdFare?.adult?.octopus || '';

        return {
          path: stationCodes,
          lines: segmentLines,
          legs,
          totalStops: Math.max(0, stationCodes.length - 1),
          ix: Math.max(0, legs.length - 1),
          journeyTime: route.time,
          walkingTime: route.walkingTime ?? 0,
          fare: octopusFare,
          firstTrain,
          lastTrain
        };
      }).filter(r => r.legs.length > 0);
    }

    function legLabel(leg){
      const ln = MTR_LINES[leg.line]?.name || leg.line;
      const a = MTR_STATIONS[leg.from]?.zh || leg.from;
      const b = MTR_STATIONS[leg.to]?.zh || leg.to;
      const st = leg.stations ? `（${leg.stations} 站）` : '';
      return `${lineDot(leg.line)}${ln} ${a} → ${b}${st}`;
    }

        const timeParts = [];
        if(p.journeyTime !== undefined && p.journeyTime !== null && p.journeyTime !== '') timeParts.push(`約 ${p.journeyTime} 分鐘`);
        if(p.walkingTime !== undefined && p.walkingTime !== null && Number(p.walkingTime) > 0) timeParts.push(`步行 ${p.walkingTime} 分鐘`);

        const trainHours = (p.firstTrain || p.lastTrain)

    async function loadMtrEta(i){
      const p=mtrPresets[i];
      const el=document.getElementById('mtr-eta-'+i);
      if(!p||!el) return;

      const needsBackfill = (p.journeyTime === undefined || p.walkingTime === undefined || !p.fare || !p.lastTrain);
      const backfillKey = `${p.from}-${p.to}-${i}`;
      if(needsBackfill && !_backfillTried.has(backfillKey)){
        _backfillTried.add(backfillKey);
        try{
          const routes = await fetchOfficialMtrRoutes(p.from, p.to);
          if(routes.length){
            const matched = routes.find(r => r.legs.length === (p.legs||[]).length) || routes[0];
            p.journeyTime = matched.journeyTime;
            p.walkingTime = matched.walkingTime ?? 0;
            p.fare = matched.fare;
            p.firstTrain = matched.firstTrain;
            p.lastTrain = matched.lastTrain;
            saveMtr();
            renderMtr();
            return;
          }
        }catch(e){}
      }

      let html='';
      for(const leg of (p.legs||[])){
        const pa=MTR_LINE_POS[leg.line]?.[leg.from] ?? 0;
        const pb=MTR_LINE_POS[leg.line]?.[leg.to] ?? 0;
        leg.dir = pb > pa ? 'UP' : 'DOWN';
        const ln=MTR_LINES[leg.line]?.name||leg.line;
        const fromZh=MTR_STATIONS[leg.from]?.zh||leg.from;
        const toZh=MTR_STATIONS[leg.to]?.zh||leg.to;
        const stCount=leg.stations?`（${leg.stations} 站）`:'';
        html += `<div class="leg-block"><div class="leg-title">${lineDot(leg.line)}${ln} · ${fromZh} → ${toZh}${stCount}</div>`;
        try{
          const res=await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${leg.line}&sta=${leg.from}`);
          const json=await res.json();
          const key=leg.line+'-'+leg.from;
          const data=json.data&&json.data[key];
          const trains=(data && data[leg.dir]) || [];
          if(!trains.length){
            html += `<div class="status" style="padding:8px">暫無此方向班次</div>`;
          } else {
            html += trains.slice(0,3).map(t=>{
              const mins=parseInt(t.ttnt,10);
              let timeStr,cls;
              if(isNaN(mins)||mins<=1){timeStr='即將到達';cls='soon';}
              else if(mins<=5){timeStr=mins+' 分鐘';cls='soon';}
              else if(mins<=15){timeStr=mins+' 分鐘';cls='mid';}
              else{timeStr=mins+' 分鐘';cls='late';}
              const dest=MTR_STATIONS[t.dest]?.zh||t.dest;
              return `<div class="eta-row"><div class="eta-meta">往 ${dest} · 月台 ${t.plat||'-'}</div><div class="eta-time ${cls}">${timeStr}</div></div>`;
            }).join('');
          }
        }catch(e){ html += `<div class="status" style="padding:8px">載入失敗</div>`; }
        html += `</div>`;
      }
      el.innerHTML = html || '<div class="status">無資料</div>';
    }

    function removeMtr(i){ if(!confirm('刪除此港鐵路線？'))return; mtrPresets.splice(i,1); saveMtr(); renderMtr(); }

    async function ensureKmbStopMap(){
  if(stopMap) return stopMap;
  const j = await (await fetch('https://etabus.gov.hk')).json();
  stopMap = {};
  (j.data || []).forEach(s => stopMap[s.stop] = s);
  return stopMap;
}

async function fetchKmbDirections(){
  const route = document.getElementById('cfgRoute').value.trim().toUpperCase();
  const hint = document.getElementById('cfgHint');
  document.getElementById('cfgDirSection').classList.add('hidden');
  document.getElementById('cfgStopSection').classList.add('hidden');
  document.getElementById('saveBtn').disabled = true;
  if(!route){ hint.textContent = '請輸入路線號碼'; return; }
  hint.innerHTML = '<span class="spinner"></span> 搜尋路線及比對班次…';

  try{
    const matches = (await (await fetch('https://etabus.gov.hk')).json()).data.filter(r => r.route === route);
    if(!matches.length){ hint.textContent = '找不到此路線'; return; }

    // Fetch stop lists for all matched variants to compare normal vs special services
    await ensureKmbStopMap();
    const stopLists = {};
    await Promise.all(matches.map(async m => {
      const dir = m.bound === 'O' ? 'outbound' : 'inbound';
      const key = m.bound + '_' + m.service_type;
      try{
        const res = await (await fetch('https://etabus.gov.hk' + m.route + '/' + dir + '/' + m.service_type)).json();
        stopLists[key] = (res.data || []).map(s => s.stop);
      }catch(e){ stopLists[key] = []; }
    }));

    const cleanName = id => ((stopMap[id] || {}).name_tc || id).replace(/\s*\([A-Z0-9]+\)\s*$/, '');

    hint.textContent = '找到 ' + matches.length + ' 個班次選項';
    document.getElementById('cfgDirList').innerHTML = matches.map(m => {
      const o = m.orig_tc || m.orig_en;
      const d = m.dest_tc || m.dest_en;
      const isNormal = String(m.service_type) === '1';
      const myStops = stopLists[m.bound + '_' + m.service_type] || [];
      const baseStops = stopLists[m.bound + '_1'] || [];

      let badgeHtml = isNormal
        ? '<span style="font-size:.75rem;color:var(--accent);font-weight:700">正常班次</span>'
        : '<span style="font-size:.75rem;color:#fbbf24;font-weight:700">特別班次</span>';

      let diffText = '共 ' + myStops.length + ' 站';
      if(!isNormal && baseStops.length && myStops.length){
        const baseSet = new Set(baseStops);
        const mySet = new Set(myStops);
        const skipped = [...new Set(baseStops.filter(id => !mySet.has(id)).map(cleanName))];
        const added = [...new Set(myStops.filter(id => !baseSet.has(id)).map(cleanName))];
        const parts = [];
        if(skipped.length) parts.push('不經：' + skipped.slice(0, 4).join('、') + (skipped.length > 4 ? ' 等' + skipped.length + '站' : ''));
        if(added.length) parts.push('改經：' + added.slice(0, 4).join('、') + (added.length > 4 ? ' 等' + added.length + '站' : ''));
        if(parts.length) diffText += ' · ' + parts.join('；');
      }

      const metaStr = JSON.stringify(m).replace(/'/g, "&#39;");
      return '<button class="btn btn-secondary" style="text-align:left;padding:12px 14px" onclick=\'selectKmbDir(' + metaStr + ')\'>' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">' + badgeHtml + '<span style="font-size:.75rem;color:var(--muted)">' + diffText + '</span></div>' +
        '<div style="font-size:.92rem;font-weight:700">' + o + ' → ' + d + '</div>' +
      '</button>';
    }).join('');
    document.getElementById('cfgDirSection').classList.remove('hidden');
  }catch(e){ hint.textContent = 'Error: ' + e.message; }
}

async function selectKmbDir(meta){
  _cfg = { type: 'kmb', meta };
  const hint = document.getElementById('cfgHint');
  hint.innerHTML = '<span class="spinner"></span> 載入車站…';
  document.getElementById('cfgStopSection').classList.add('hidden');
  document.getElementById('saveBtn').disabled = true;
  try{
    await ensureKmbStopMap();
    const dir = meta.bound === 'O' ? 'outbound' : 'inbound';
    const stops = (await (await fetch('https://etabus.gov.hk' + meta.route + '/' + dir + '/' + meta.service_type)).json()).data || [];
    document.getElementById('cfgStop').innerHTML = stops.map((s,i) => {
      const name = (stopMap[s.stop] || {}).name_tc || s.stop;
      return '<option value="' + s.stop + '" data-name="' + name.replace(/"/g, '&quot;') + '">' + (i+1) + '. ' + name + '</option>';
    }).join('');
    document.getElementById('cfgStopSection').classList.remove('hidden');
    document.getElementById('saveBtn').disabled = false;
    hint.textContent = stops.length + ' 個車站';
  }catch(e){ hint.textContent = 'Error: ' + e.message; }
}


    function openMtrSettings(){
      const lineOpts=Object.keys(MTR_LINES).map(lc=>`<option value="${lc}">${MTR_LINES[lc].name}</option>`).join('');
      document.getElementById('modalBody').innerHTML=`
        <label>出發站</label>
        <div class="mtr-row"><select id="cfgFromLine" onchange="cfgFillSta('from')">${lineOpts}</select><select id="cfgFromSta"></select></div>
        <label>到達站</label>
        <div class="mtr-row"><select id="cfgToLine" onchange="cfgFillSta('to')">${lineOpts}</select><select id="cfgToSta"></select></div>
        <button class="btn btn-primary" style="width:100%;margin-top:14px" onclick="calcMtrPaths()">查詢官方路線</button>
        <div class="search-hint" id="cfgHint"></div>
        <div id="cfgPathList" style="margin-top:12px"></div>`;
      document.getElementById('cfgFromLine').value='TML';
      document.getElementById('cfgToLine').value='EAL';
      cfgFillSta('from'); cfgFillSta('to');
      const fromSta=document.getElementById('cfgFromSta');
      const toSta=document.getElementById('cfgToSta');
      [...fromSta.options].forEach(o=>{ if(o.text==='第一城') fromSta.value=o.value; });
      [...toSta.options].forEach(o=>{ if(o.text==='九龍塘') toSta.value=o.value; });
      renderCfgListMtr();
    }
    function cfgFillSta(which){
      const lineEl=document.getElementById(which==='from'?'cfgFromLine':'cfgToLine');
      const staEl=document.getElementById(which==='from'?'cfgFromSta':'cfgToSta');
      const sts=MTR_LINES[lineEl.value]?.stations||[];
      staEl.innerHTML=sts.map(s=>`<option value="${s.c}">${s.zh}</option>`).join('');
    }
    async function calcMtrPaths(){
      const from=document.getElementById('cfgFromSta').value;
      const to=document.getElementById('cfgToSta').value;
      const hint=document.getElementById('cfgHint');
      const list=document.getElementById('cfgPathList');
      _selectedPath=null;
      document.getElementById('saveBtn').disabled=true;
      if(!from||!to||from===to){ hint.textContent='請選擇不同的出發與到達站'; list.innerHTML=''; return; }
      hint.innerHTML='<span class="spinner"></span> 向港鐵查詢官方路線…';
      list.innerHTML='';
      try{
        const paths=await fetchOfficialMtrRoutes(from, to);
        if(!paths.length){ hint.textContent='找不到路線'; return; }
        const trainNote = (paths[0].firstTrain && paths[0].lastTrain) ? `（頭班 ${paths[0].firstTrain} · 尾班 ${paths[0].lastTrain}）` : '';
        hint.textContent=`找到 ${paths.length} 條官方建議路線${trainNote}`;
        list.innerHTML=paths.map((p,idx)=>{
          const ix=p.legs.length-1;
          const summary=p.legs.map(legLabel).join('<br>');
          const badge=ix===0?'直達':`轉車 ${ix} 次`;
          const walkStr=(p.walkingTime !== undefined && Number(p.walkingTime) > 0)?`（步行 ${p.walkingTime} 分鐘）`:'';
          const timeStr=p.journeyTime?` · 約 ${p.journeyTime} 分鐘${walkStr}`:'';
          const fareStr=p.fare?` · $${parseFloat(p.fare).toFixed(1)}`:'';
          return `<button class="path-option" id="pathOpt${idx}" onclick="selectPath(${idx})">
            <div style="font-weight:700;margin-bottom:4px">${badge}${timeStr} · 共 ${p.totalStops} 站<span style="color:#f87171">${fareStr}</span></div>
            <div style="font-size:.85rem;color:var(--muted);line-height:1.55">${summary}</div>
          </button>`;
        }).join('');
        window._pathOptions=paths;
      }catch(e){
        hint.textContent='查詢失敗：'+e.message;
      }
    }
    function selectPath(idx){
      _selectedPath=window._pathOptions[idx];
      document.querySelectorAll('.path-option').forEach((el,i)=>el.classList.toggle('selected',i===idx));
      document.getElementById('saveBtn').disabled=false;
    }
    function renderCfgListMtr(){
      const el=document.getElementById('cfgList');
      if(!mtrPresets.length){el.innerHTML='<div style="color:var(--muted);font-size:.85rem">（無）</div>';return;}
      el.innerHTML=mtrPresets.map((p,i)=>{
        const a=MTR_STATIONS[p.from]?.zh||p.from, b=MTR_STATIONS[p.to]?.zh||p.to;
        return `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #2a2a3a;font-size:.9rem"><span><strong style="color:var(--accent)">${a}</strong> → ${b}</span><button class="icon-btn danger" style="width:28px;height:28px" onclick="removeMtr(${i});openSettings()">✕</button></div>`;
      }).join('');
    }

    function saveCurrentPreset(){
      if(currentTab==='kmb'){
        const meta=_cfg.meta; if(!meta) return;
        const stopId=document.getElementById('cfgStop').value;
        const opt=document.getElementById('cfgStop').selectedOptions[0];
        const stopName=opt?.dataset.name||stopId;
        const preset={route:meta.route,bound:meta.bound,service_type:String(meta.service_type),stopId,stopName,dest_tc:meta.dest_tc||'',orig_tc:meta.orig_tc||''};
        if(kmbPresets.some(p=>p.route===preset.route&&p.stopId===preset.stopId&&p.bound===preset.bound)){alert('此組合已存在');return;}
        kmbPresets.push(preset); saveKmb(); closeSettings(); renderKmb();
      } else {
        if(!_selectedPath) return;
        const from=document.getElementById('cfgFromSta').value;
        const to=document.getElementById('cfgToSta').value;
        const preset={
          from,
          to,
          legs: _selectedPath.legs,
          totalStops: _selectedPath.totalStops,
          journeyTime: _selectedPath.journeyTime,
          walkingTime: _selectedPath.walkingTime ?? 0,
          fare: _selectedPath.fare,
          firstTrain: _selectedPath.firstTrain,
          lastTrain: _selectedPath.lastTrain
        };
        if(mtrPresets.some(p=>p.from===from&&p.to===to&&JSON.stringify(p.legs)===JSON.stringify(preset.legs))){alert('此組合已存在');return;}
        mtrPresets.push(preset); saveMtr(); closeSettings(); renderMtr();
      }
    }

    // INIT
    switchTab('kmb');
    renderKmb();
    renderMtr();
    loadWeather();
    setInterval(refreshKmb, 30000);
    setInterval(refreshMtr, 30000);
    setInterval(loadWeather, 30*60*1000);
    setInterval(updateWeatherClock, 1000);
    document.getElementById('settingsModal').addEventListener('click', e => { if(e.target.id==='settingsModal') closeSettings(); });
  </script>
</body>
</html>
